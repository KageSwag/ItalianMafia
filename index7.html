<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAFIA</title><meta name="theme-color" content="#070509"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%23070509%27/%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2722%27 fill=%27%23d90429%27/%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%278%27 fill=%27%23070509%27/%3E%3C/svg%3E"><script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Unbounded:wght@900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070509;--ink:#ece3d6;--dim:#8d8b99;--hot:#d90429;--line:#ffffff22;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#070509;--ink:#ece3d6}}
:root[data-theme="dark"]{--bg:#070509}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;overflow:hidden}
#app{height:100%;position:relative}
.scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 20px 96px;text-align:center}
.scene.on{display:flex;animation:in .6s}
@keyframes in{from{opacity:0}to{opacity:1}}
h2{margin:0;font-size:30px;font-weight:900}
p{margin:0;line-height:1.9;font-size:14px}
.dim{color:var(--dim)}
.lbl{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.02em}
.cta{background:var(--ink);color:#0a0a10;border:0;border-radius:99px;padding:15px 36px;font:900 16px Vazirmatn,sans-serif;position:relative;z-index:6}
.ghost{background:none;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:10px 22px;font:700 13px Vazirmatn,sans-serif}
.cta:active,.ghost:active{transform:scale(.96)}
#fx{position:fixed;inset:0;z-index:55;pointer-events:none}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-end:12px;z-index:60;background:none;border:1px solid var(--line);color:var(--ink);border-radius:50%;width:38px;height:38px;font-size:16px}
#snd.m{opacity:.35}
nav{position:absolute;inset-inline:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:58px;border-radius:99px;background:#15151dcc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);display:none;z-index:40;padding:0 6px}
nav.on{display:flex}
nav button{flex:1;background:none;border:0;color:var(--dim);font:700 13px Vazirmatn,sans-serif;position:relative}
nav button.on{color:var(--ink)}
nav button.on::after{content:"";position:absolute;bottom:7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--hot)}
.glitch{animation:gl .5s steps(2)}
@keyframes gl{0%{transform:translateX(-8px) skewX(4deg);filter:invert(1)}25%{transform:translateX(10px);filter:none}50%{transform:translateX(-5px) skewX(-3deg);filter:hue-rotate(90deg)}75%{filter:invert(1)}100%{transform:none;filter:none}}

/* intro */
.wm{font:900 min(17vw,84px) Unbounded,sans-serif;margin:0;color:transparent;-webkit-background-clip:text;background-clip:text;background-image:radial-gradient(circle 150px at var(--wx,50%) var(--wy,50%),#fff 0,#ffffff55 55%,#ffffff14 100%);letter-spacing:.02em}
/* scratch */
.scr{position:relative;width:280px;height:380px;border-radius:28px;overflow:hidden;border:1px solid var(--line)}
.under{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;background:var(--ink);color:#0a0a10}
.scr.m .under{background:var(--hot)}
.under small{font-weight:700;font-size:13px;opacity:.6}
.under b{font-size:56px;font-weight:900;line-height:1.1}
.under span{font-size:14px;line-height:1.9;font-weight:700;opacity:.75}
#sc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .6s}
.scr.open #sc{opacity:0;pointer-events:none}
/* night */
.veil{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle 130px at var(--lx,50%) var(--ly,60%),transparent 0,#070509e6 100%)}
#s2 h2,#s2 p{position:relative;z-index:6}
.grid{display:grid;grid-template-columns:repeat(3,86px);gap:20px;position:relative;z-index:2}
.pl{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:700;position:relative}
.pl i{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font:900 28px Vazirmatn;font-style:normal;color:#0a0a10;background:radial-gradient(circle at 35% 30%,#fff,#b9b6c4);transition:.35s;position:relative}
.pl.sel{z-index:7}
.pl.sel i{background:radial-gradient(circle at 35% 30%,#ff7d8a,var(--hot));box-shadow:0 0 0 5px var(--bg),0 0 0 7px var(--hot),0 0 40px var(--hot)}
.pl.dead i,.pl.dead span{opacity:0;transform:scale(1.6);transition:.5s}
/* detective */
.reticle{position:relative;width:190px;height:190px;display:grid;place-items:center;font:900 60px Vazirmatn}
.reticle svg{position:absolute;inset:0;fill:none;stroke:var(--ink)}
.reticle .r1{stroke-width:1;stroke-dasharray:3 9;animation:rot 18s linear infinite;transform-origin:center}
.reticle .r2{stroke:var(--hot);stroke-width:2;stroke-dasharray:60 520;transform-origin:center;animation:rot 3s linear infinite}
.reticle.spin .r2{animation-duration:.5s;stroke-dasharray:200 380}
.reticle path{stroke-width:2}
@keyframes rot{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:320px}
.chip{border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:700;font-size:14px;color:var(--dim);transition:.2s}
.chip.on{background:var(--ink);color:#0a0a10;border-color:var(--ink)}
#flood{position:fixed;inset:0;z-index:45;display:grid;place-content:center;gap:10px;text-align:center;clip-path:circle(0 at 50% 50%);transition:clip-path .8s cubic-bezier(.7,0,.2,1);pointer-events:none;color:#0a0a10;background:var(--ink)}
#flood.on{clip-path:circle(150% at 50% 50%);pointer-events:auto}
#flood.m{background:var(--hot)}
#flood b{font:900 min(26vw,120px) Vazirmatn}
#flood small{font-weight:700;opacity:.6}
/* morning */
#s4{background:#cfd0cc;color:#0a0a10}
#s4.on{animation:up 1.1s ease}
@keyframes up{from{clip-path:circle(0 at 50% 100%)}to{clip-path:circle(150% at 50% 100%)}}
#s4 .dim,#s4 .lbl{color:#6a6874}
.red{position:relative;display:inline-block;overflow:hidden;font:900 72px Vazirmatn;line-height:1.5;padding:0 10px}
.bar{position:absolute;inset:0;background:#0a0a10;transition:transform .7s cubic-bezier(.7,0,.2,1)}
.bar.go{transform:translateX(110%)}
.strike{position:absolute;left:0;right:0;top:56%;height:7px;background:var(--hot);transform:scaleX(0);transform-origin:right;transition:transform .35s;text-decoration:none}
.strike.go{transform:scaleX(1)}
#s4 .ghost{color:#0a0a10;border-color:#0a0a1033}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
#fog{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fog::before,#fog::after{content:"";position:absolute;inset:-30%;background:radial-gradient(ellipse 40% 30% at 30% 40%,#ffffff14,transparent 70%),radial-gradient(ellipse 35% 25% at 70% 65%,#d9042918,transparent 70%);animation:drift 28s ease-in-out infinite alternate}
#fog::after{animation-duration:41s;animation-direction:alternate-reverse;opacity:.8}
@keyframes drift{to{transform:translate(12%,8%) scale(1.15)}}
.logo{width:46px;height:46px;color:inherit}
.logo.big{width:132px;height:132px;color:var(--ink);filter:drop-shadow(0 0 18px #d9042988);animation:fl 5s steps(1) infinite}
@keyframes fl{0%,100%{opacity:1}46%{opacity:.55}48%{opacity:1}52%{opacity:.7}54%{opacity:1}}
.lg{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);inset-inline-start:14px;width:34px;height:34px;opacity:.7;color:var(--ink);pointer-events:none}
#s4 .lg{color:#0a0a10}
.scr.m .under,#flood.m{--acc:#ece3d6}
.moon{position:absolute;top:calc(env(safe-area-inset-top,0px) + 60px);inset-inline-end:26px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff6b4a,#8b0a14 70%);box-shadow:0 0 70px #d9042999;z-index:6;animation:fl 7s steps(1) infinite}
.veil{animation:fk 2.6s ease-in-out infinite}@keyframes fk{50%{opacity:.9}}
input{width:min(260px,80vw);background:#ffffff0f;border:1px solid var(--line);border-radius:99px;padding:13px 18px;color:var(--ink);font:700 15px Vazirmatn,sans-serif;text-align:center;outline:0;user-select:text;-webkit-user-select:text}
.cta:disabled{opacity:.4}
#tm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:50%;transform:translateX(-50%);z-index:60;font:900 15px Unbounded,sans-serif;color:#fff;mix-blend-mode:difference;pointer-events:none}
</style>
</head>
<body>
<div id="app">
<div id="fog"></div><svg style="position:absolute;width:0;height:0"><symbol id="lg" viewBox="0 0 100 100"><mask id="cm"><rect width="100" height="100" fill="#fff"/><circle cx="60" cy="42" r="28" fill="#000"/></mask><circle cx="50" cy="50" r="47" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 4"/><circle cx="46" cy="54" r="32" fill="currentColor" mask="url(#cm)"/><path d="M42 42Q60 26 78 42Q60 58 42 42Z" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="60" cy="42" r="7" style="fill:var(--acc,#d90429)"/><circle cx="60" cy="42" r="3" fill="#070509"/><path d="M60 62q-4 5 0 9q4-4 0-9z" style="fill:var(--acc,#d90429)"/></symbol></svg><canvas id="fx"></canvas><button id="snd">♪</button>

<section class="scene on" id="s0">
 <svg class="logo big"><use href="#lg"/></svg>
 <h1 class="wm" id="wm">MAFIA</h1>
 <p class="dim">یکی بین شما دروغ می‌گه</p>
 <button class="cta" id="enter">شروع بازی</button>
</section>

<section class="scene" id="sj">
 <h2>ورود به بازی</h2>
 <input id="nick" maxlength="12" placeholder="اسمت">
 <button class="cta" id="mk">ساخت اتاق</button>
 <p class="dim">یا کد اتاق دوستت رو بزن</p>
 <input id="code" maxlength="5" placeholder="کد اتاق" style="text-transform:uppercase;direction:ltr">
 <button class="ghost" id="jn">ورود</button>
 <p class="dim" id="err"></p>
</section>

<section class="scene" id="sl">
 <p class="lbl">کد اتاق</p>
 <h2 id="rc" style="font-family:Unbounded,sans-serif;letter-spacing:.2em;direction:ltr"></h2>
 <div class="chips" id="gl"></div>
 <p class="dim" id="lm"></p>
 <button class="ghost" id="shr">دعوت دوستان</button>
 <button class="cta" id="st">شروع بازی</button>
</section>

<section class="scene" id="s1">
 <p class="lbl">نقش تو</p>
 <div class="scr" id="scr"><div class="under"><svg class="logo"><use href="#lg"/></svg><small id="team"></small><b id="rn"></b><span id="rd"></span></div><canvas id="sc" width="280" height="380"></canvas></div>
 <p class="dim" id="hint"></p>
 <button class="cta" id="nextRole">آماده‌ام</button>
</section>

<section class="scene" id="s2">
 <div class="veil"></div><div class="moon"></div>
 <h2 id="nt">شب شد</h2>
 <p class="dim" id="np"></p>
 <div class="grid" id="g2"></div>
 <button class="cta" id="fire">تأیید</button>
</section>

<section class="scene" id="sd">
 <p class="lbl" id="dl">نوبت صحبت</p>
 <div class="pl sel"><i id="di" style="width:120px;height:120px;font-size:48px"></i></div>
 <h2 id="dn"></h2>
 <p class="dim" id="dt"></p>
 <button class="cta" id="pass">تمام شد</button>
 <div class="chips" id="gd"></div>
</section>

<section class="scene" id="sv">
 <h2>رأی‌گیری</h2>
 <p class="dim">کی باید بره؟</p>
 <div class="chips" id="gv"></div>
 <p class="dim" id="vt"></p>
 <button class="cta" id="vb">ثبت رأی</button>
</section>

<section class="scene" id="s4">
 <p class="lbl" id="l4">گزارش صبح</p>
 <div class="red"><span id="nm"></span><i class="bar" id="bar"></i><u class="strike" id="stk"></u></div>
 <h2 id="h4"></h2>
 <p class="dim" id="p4"></p>
</section>

<section class="scene" id="se">
 <p class="lbl">پایان بازی</p>
 <h2 id="ew"></h2>
 <div class="chips" id="ge"></div>
 <button class="ghost" id="again">بازی دوباره</button>
</section>

<div id="flood"><svg class="logo" style="width:72px;height:72px;margin:auto"><use href="#lg"/></svg><b id="fw"></b><small id="fs"></small></div>
<div id="tm"></div>
</div>

<script>
var roles=[
 {n:"مافیا",t:"تیم مافیا",m:1,d:"هر شب یه نفر رو حذف می‌کنی. روز باید طوری رفتار کنی که لو نری."},
 {n:"دکتر",t:"تیم شهروند",d:"هر شب یه نفر رو نجات می‌دی. دو شب پشت‌هم نمی‌تونی یه نفر رو انتخاب کنی."},
 {n:"کارآگاه",t:"تیم شهروند",d:"هر شب از یه نفر استعلام می‌گیری: مافیاست یا نه؟"},
 {n:"شهروند",t:"تیم شهروند",d:"قدرت خاصی نداری، ولی رأی تو نتیجه‌ی بازی رو عوض می‌کنه."}
];
var names=["آرش","بهار","سامان","نیلوفر","کیان","مینا"],mafia=4,ri=0;
function $(i){return document.getElementById(i)}
var TG=window.Telegram&&Telegram.WebApp;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor("#070509");TG.setBackgroundColor("#070509")}catch(e){}}
function buzz(p){try{if(TG&&TG.HapticFeedback){TG.HapticFeedback.impactOccurred(p&&p.length?"heavy":"light");return}navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* audio */
var AC,mute=false,dr=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,t,v,f2){var a=ac();if(!a||mute)return;var o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=t||"sine";o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v||.2,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(a.destination);o.start();o.stop(n+d)}
function noise(d,v,fq){var a=ac();if(!a||mute)return;var b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(var i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type="lowpass";f.frequency.value=fq;g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
function drone(on){var a=ac();if(!a)return;if(dr){var old=dr;try{old.g.gain.linearRampToValueAtTime(0,a.currentTime+.8)}catch(e){}setTimeout(function(){old.o.forEach(function(x){try{x.stop()}catch(e){}})},900);dr=null}
 if(!on||mute)return;var g=a.createGain(),f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=200;g.gain.value=0;g.gain.linearRampToValueAtTime(.08,a.currentTime+2);
 var o=[55,55.5,110].map(function(h){var x=a.createOscillator();x.type="sawtooth";x.frequency.value=h;x.connect(f);x.start();return x});f.connect(g);g.connect(a.destination);dr={g:g,o:o}}
$("snd").onclick=function(){mute=!mute;this.classList.toggle("m",mute);if(mute)drone(false);else{ac();if($("s2").classList.contains("on"))drone(true)}};
function glitch(){var a=$("app");a.classList.remove("glitch");void a.offsetWidth;a.classList.add("glitch")}

/* scenes */
function show(id){
 document.querySelectorAll(".scene").forEach(function(s){s.classList.toggle("on",s.id===id)});
 document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.s===id)});
 $("flood").classList.remove("on");drone(id==="s2");
 
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){show(b.dataset.s)}});

/* light follower + particles */
document.querySelectorAll(".scene:not(#s0)").forEach(function(x){x.insertAdjacentHTML("afterbegin",'<svg class="lg"><use href="#lg"/></svg>')});
var W,H,lx=0,ly=0,tx=0,ty=0,last=0,cv=$("fx"),cx=cv.getContext("2d"),B=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;if(!lx){lx=tx=W/2;ly=ty=H/2}}addEventListener("resize",rs);rs();var E=[];for(var i=0;i<40;i++)E.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.8,v:Math.random()*.5+.2,p:Math.random()*6});
addEventListener("pointermove",function(e){tx=e.clientX;ty=e.clientY;last=performance.now()});
function burst(x,y){for(var i=0;i<80;i++){var a=Math.random()*6.28,s=Math.random()*8+2;B.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,z:Math.random()*5+2,c:Math.random()<.5?"#d90429":"#ece3d6"})}}
(function loop(n){
 if(n-last>2500){tx=W/2+W*.32*Math.sin(n/1100);ty=H*.5+H*.22*Math.sin(n/1700)}
 lx+=(tx-lx)*.12;ly+=(ty-ly)*.12;
 if($("s2").classList.contains("on")){var r=$("s2");r.style.setProperty("--lx",lx+"px");r.style.setProperty("--ly",ly+"px")}
 if($("s0").classList.contains("on")){var w=$("wm").getBoundingClientRect(),e=$("wm");e.style.setProperty("--wx",(lx-w.left)+"px");e.style.setProperty("--wy",(ly-w.top)+"px")}
 cx.clearRect(0,0,W,H);cx.fillStyle="#ff4d3a";E.forEach(function(e){e.y-=e.v;e.x+=Math.sin(n/900+e.p)*.35;if(e.y<-5){e.y=H+5;e.x=Math.random()*W}cx.globalAlpha=.25+.3*Math.abs(Math.sin(n/700+e.p));cx.fillRect(e.x,e.y,e.s,e.s)});
 B=B.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l-=.016;if(p.l<=0)return false;cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.z,p.z);return true});
 cx.globalAlpha=1;requestAnimationFrame(loop)})(0);

/* role scratch */
var sc=$("sc"),c=sc.getContext("2d"),seen={},cnt=0,drawing=false,px=0,py=0;
function setRole(){var r=roles[ri];$("rn").textContent=r.n;$("team").textContent=r.t;$("rd").textContent=r.d+(r.m&&S&&S.mf.length>1?" هم‌تیمی‌ات: "+S.mf.filter(function(i){return i!==S.me}).map(function(i){return S.pl[i].n}).join("، "):"");$("scr").classList.toggle("m",!!r.m)}
function cover(){
 seen={};cnt=0;$("scr").classList.remove("open");c.globalCompositeOperation="source-over";
 var g=c.createLinearGradient(0,0,280,380);g.addColorStop(0,"#363642");g.addColorStop(.5,"#1c1c25");g.addColorStop(1,"#2c2c37");c.fillStyle=g;c.fillRect(0,0,280,380);
 for(var i=0;i<1100;i++){c.fillStyle="rgba(255,255,255,"+Math.random()*.07+")";c.fillRect(Math.random()*280,Math.random()*380,1.5,1.5)}
 c.fillStyle="#ffffff66";c.font="900 24px Vazirmatn,sans-serif";c.textAlign="center";c.strokeStyle="#ffffff44";c.lineWidth=3;c.beginPath();c.arc(140,130,50,0,6.28);c.moveTo(102,130);c.quadraticCurveTo(140,96,178,130);c.quadraticCurveTo(140,164,102,130);c.moveTo(150,130);c.arc(140,130,10,0,6.28);c.stroke();c.fillText("بکش",140,260);
}
function pos(e){var r=sc.getBoundingClientRect();return[(e.clientX-r.left)*280/r.width,(e.clientY-r.top)*380/r.height]}
sc.addEventListener("pointerdown",function(e){drawing=true;sc.setPointerCapture(e.pointerId);var p=pos(e);px=p[0];py=p[1];sc.dispatchEvent(new PointerEvent("pointermove",e))});
sc.addEventListener("pointermove",function(e){
 if(!drawing)return;var p=pos(e);
 c.globalCompositeOperation="destination-out";c.lineWidth=50;c.lineCap="round";c.beginPath();c.moveTo(px,py);c.lineTo(p[0],p[1]);c.stroke();px=p[0];py=p[1];
 for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){var k=((px/20|0)+dx)+","+((py/20|0)+dy);if(!seen[k]){seen[k]=1;cnt++}}
 if(cnt>165&&!$("scr").classList.contains("open")){$("scr").classList.add("open");buzz([40,40,90]);tone(220,.4,"triangle",.2,440);noise(.25,.2,3000);$("hint").textContent="فقط خودت می‌بینی. وقتی حفظش کردی دوباره پنهانش کن."}
});
["pointerup","pointercancel"].forEach(function(t){sc.addEventListener(t,function(){drawing=false})});
setRole();(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(cover);cover();

/* ===== multiplayer: host-authoritative, WebRTC via PeerJS ===== */
var APP="";/* لینک مینی‌اپ تلگرام، مثلا https://t.me/YourBot/play */
var ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};/* برای شبکه‌های سخت یه TURN هم اینجا اضافه کن */
var RI={mafia:0,doctor:1,det:2,cit:3},RN={mafia:"مافیا",doctor:"دکتر",det:"کارآگاه",cit:"شهروند"};
var S,me=-1,host=false,peer,H,C=[null],G,mic,calls={},auds={},nick,code,tmr,rk="",pk=-1;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function say(id,t){$(id).textContent=t}
function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t}return a}
function alive(){return S.pl.map(function(p,i){return i}).filter(function(i){return S.pl[i].a})}
try{TG&&TG.enableClosingConfirmation()}catch(e){}

/* voice */
async function getMic(){try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});mic.real=1}catch(e){var a=ac();mic=a?a.createMediaStreamDestination().stream:new MediaStream()}}
function ans(c){c.answer(mic);hook(c)}
function hook(c){calls[c.peer]=c;c.on("stream",function(s){var a=auds[c.peer]||(auds[c.peer]=new Audio());a.srcObject=s;a.autoplay=true;a.playsInline=true;a.play().catch(function(){});voice()});c.on("close",function(){delete calls[c.peer]});c.on("error",function(){delete calls[c.peer]})}
function link(){if(!S||!mic||!peer)return;S.pl.forEach(function(p,i){if(i>me&&p.k&&!calls[p.k])hook(peer.call(p.k,mic))})}
function voice(){if(!S||!mic)return;var v=S,m=v.pl[v.me],P=v.ph,mf=v.ro==="mafia"&&m.a,free=P==="lobby"||P==="end",sp=free||(P==="night"&&mf)||(P==="day"&&v.sp===v.me&&m.a);
 mic.getAudioTracks().forEach(function(t){t.enabled=!!sp});
 v.pl.forEach(function(q,i){var a=auds[q.k];if(a)a.muted=!(free||(P==="night"?mf&&v.mf.indexOf(i)>=0:true))})}
document.addEventListener("pointerdown",function(){Object.keys(auds).forEach(function(k){auds[k].paused&&auds[k].play().catch(function(){})})});

/* networking */
function perr(e){say("err",e.type==="peer-unavailable"?"اتاقی با این کد پیدا نشد":"خطای اتصال ("+e.type+")");show("sj")}
function mkRoom(){code=sh("ABCDEFGHJKLMNPQRSTUVWXYZ23456789".split("")).slice(0,5).join("");
 peer=new Peer("mfa-"+code,{config:ICE});
 peer.on("error",function(e){if(e.type==="unavailable-id"){peer.destroy();mkRoom()}else perr(e)});
 peer.on("call",ans);
 peer.on("connection",function(c){c.on("data",function(d){hm(c,d)});c.on("close",function(){drop(c)})});
 peer.on("open",function(){host=true;me=0;G={ph:"lobby",rd:0,p:[{n:nick,k:peer.id,a:1}],done:{},ls:-1};bc()})}
function jn(){say("err","در حال اتصال…");peer=new Peer({config:ICE});peer.on("error",perr);peer.on("call",ans);
 peer.on("open",function(){H=peer.connect("mfa-"+code,{reliable:true});
  H.on("open",function(){H.send({t:"join",n:nick})});H.on("data",gm);
  H.on("close",function(){if(!S||S.ph!=="end"){say("err","اتصال با میزبان قطع شد");show("sj")}})})}
function gm(d){if(d.t==="me")me=d.i;else if(d.t==="st")apply(d.v);else if(d.t==="look")look(d);else if(d.t==="no"){say("err","اتاق پر است یا بازی شروع شده");show("sj")}}
function hm(c,d){var i=C.indexOf(c);
 if(d.t==="join"){if(G.ph!=="lobby"||G.p.length>=6){c.send({t:"no"});return}
  C[G.p.length]=c;G.p.push({n:String(d.n||"بازیکن").slice(0,12),k:c.peer,a:1});c.send({t:"me",i:G.p.length-1});bc()}
 else if(i>0)act(i,d)}
function drop(c){var i=C.indexOf(c);if(i<1)return;if(G.ph==="lobby"){G.p.splice(i,1);C.splice(i,1);C.forEach(function(x,j){x&&x.send({t:"me",i:j})})}else G.p[i].a=0;bc()}
function send(i,m){var c=C[i];if(c&&c.open)c.send(m)}
function sn(m){host?act(0,m):H.send(m)}
function view(i){var p=G.p[i];return{ph:G.ph,rd:G.rd,me:i,pl:G.p.map(function(x){return{n:x.n,k:x.k,a:x.a}}),ro:p.ro,mf:p.ro==="mafia"?G.p.map(function(x,j){return x.ro==="mafia"?j:-1}).filter(function(j){return j>=0}):[],sp:G.sp,ms:G.dl?Math.max(0,G.dl-Date.now()):0,rep:G.rep,ls:p.ro==="doctor"?G.ls:-1,done:G.done[i]||0,end:G.end?{w:G.end,ro:G.p.map(function(x){return x.ro})}:null}}
function bc(){C.forEach(function(c,i){if(c&&c.open)c.send({t:"st",v:view(i)})});apply(view(0))}

/* game logic (host only) */
function ph(p,sec){G.ph=p;G.dl=sec?Date.now()+sec*1000:0;clearTimeout(tmr);if(sec)tmr=setTimeout(tick,sec*1000);G.done={};bc()}
function tick(){({role:night,night:resolveNight,morning:startDay,day:nextSpeaker,vote:resolveVote,voteres:afterVote})[G.ph]()}
function startGame(){var n=G.p.length,r=[];for(var i=0;i<(n>=6?2:1);i++)r.push("mafia");r.push("doctor","det");while(r.length<n)r.push("cit");sh(r);G.p.forEach(function(x,j){x.ro=r[j];x.a=1});G.rd=0;G.ls=-1;G.end=null;ph("role",40)}
function night(){G.rd++;G.nk={};G.sv=-1;G.rep=null;ph("night",40)}
function tally(o){var c={},mx=0,b=[];Object.keys(o).forEach(function(k){var g=o[k];c[g]=(c[g]||0)+1});Object.keys(c).forEach(function(g){if(c[g]>mx){mx=c[g];b=[+g]}else if(c[g]===mx)b.push(+g)});return b}
function rep(k,d){G.rep={k:k,n:d>=0?G.p[d].n:null,ro:d>=0?G.p[d].ro:null}}
function resolveNight(){var b=tally(G.nk),k=b.length?b[Math.random()*b.length|0]:-1,d=-1;if(k>=0&&k!==G.sv){d=k;G.p[k].a=0}G.ls=G.sv;rep("n",d);ph("morning",8)}
function win(){var m=G.p.filter(function(x){return x.a&&x.ro==="mafia"}).length,c=G.p.filter(function(x){return x.a&&x.ro!=="mafia"}).length,w=!m?"cit":m>=c?"maf":null;if(w){G.end=w;ph("end",0);return true}return false}
function startDay(){if(win())return;G.order=sh(G.p.map(function(x,i){return i}).filter(function(i){return G.p[i].a}));G.si=-1;nextSpeaker()}
function nextSpeaker(){G.si++;if(G.si>=G.order.length){G.vt={};return ph("vote",30)}G.sp=G.order[G.si];ph("day",30)}
function resolveVote(){var b=tally(G.vt),d=b.length===1?b[0]:-1;if(d>=0)G.p[d].a=0;rep("v",d);ph("voteres",8)}
function afterVote(){if(win())return;night()}
function act(i,m){var p=G.p[i];if(!p)return;
 if(m.t==="ready"&&G.ph==="role"){G.done[i]=1;if(G.p.every(function(x,j){return G.done[j]}))return night();bc()}
 else if(G.ph==="night"&&p.a&&m.t==="act"&&!G.done[i]){var tg=G.p[m.g];if(!tg||!tg.a)return;
  if(p.ro==="mafia"&&m.a==="kill"&&tg.ro!=="mafia"){G.nk[i]=m.g;G.done[i]=1}
  else if(p.ro==="doctor"&&m.a==="save"&&m.g!==G.ls){G.sv=m.g;G.done[i]=1}
  else if(p.ro==="det"&&m.a==="look"&&m.g!==i){G.done[i]=1;var r={t:"look",g:m.g,m:tg.ro==="mafia"};i?send(i,r):look(r)}
  bc()}
 else if(G.ph==="vote"&&p.a&&m.t==="act"&&!G.done[i]&&G.p[m.g]&&G.p[m.g].a&&m.g!==i){G.vt[i]=m.g;G.done[i]=1;if(G.p.every(function(x,j){return!x.a||G.done[j]}))return resolveVote();bc()}
 else if(G.ph==="day"&&m.t==="pass"&&i===G.sp)nextSpeaker()}

/* client rendering */
function apply(v){S=v;S.dl=v.ms?Date.now()+v.ms:0;me=v.me;render();voice();link()}
function render(){var v=S,k=v.ph+v.rd+(v.ph==="day"?v.sp:"");if(v.ph==="lobby")return lob();if(k!==rk){rk=k;build()}upd()}
function lob(){rk="";var v=S,g=$("gl"),n=v.pl.length;g.innerHTML="";v.pl.forEach(function(p,i){g.appendChild(el("div","chip"+(i===v.me?" on":""),p.n))});say("rc",code);
 say("lm",n+" از ۶ نفر"+(host?(n<4?" · حداقل ۴ نفر لازمه":" · می‌تونی شروع کنی"):" · منتظر میزبان…")+(mic&&mic.real?"":" · میکروفون فعال نیست"));
 $("st").style.display=$("shr").style.display=host?"":"none";$("st").disabled=n<4;show("sl")}
function picks(id,ids,cls){var g=$(id);g.innerHTML="";pk=-1;ids.forEach(function(i){var n=S.pl[i].n,d=el("div",cls);if(cls==="chip")d.textContent=n;else{d.appendChild(el("i",0,n[0]));d.appendChild(el("span",0,n))}
 d.onclick=function(){if(S.done)return;pk=i;Array.prototype.forEach.call(g.children,function(x){x.classList.toggle(cls==="chip"?"on":"sel",x===d)});buzz(20);tone(500,.08,"sine",.1)};g.appendChild(d)})}
function build(){var v=S,P=v.ph;
 if(P==="role"){ri=RI[v.ro];setRole();cover();say("hint","با انگشتت بکش تا نقشت معلوم بشه");show("s1")}
 else if(P==="night"){nightB();show("s2")}
 else if(P==="morning"||P==="voteres")repB();
 else if(P==="day")dayB();
 else if(P==="vote"){var ok=v.pl[v.me].a;picks("gv",ok?alive().filter(function(i){return i!==v.me}):[],"chip");$("vb").style.display=ok?"":"none";say("vt",ok?"":"تو حذف شدی؛ فقط تماشا کن.");show("sv")}
 else if(P==="end")endB()}
function upd(){var v=S,P=v.ph,d=v.done;
 if(P==="night"||P==="vote"){var b=P==="night"?$("fire"):$("vb");b.disabled=!!d;say(b.id,d?"ثبت شد":P==="night"?"تأیید":"ثبت رأی")}
 if(P==="role"){$("nextRole").disabled=!!d;say("nextRole",d?"منتظر بقیه…":"آماده‌ام")}}
function nightB(){var v=S,r=v.ro,a=alive(),live=v.pl[v.me].a,can=live&&r!=="cit",ids=[];
 if(can)ids=r==="mafia"?a.filter(function(i){return v.mf.indexOf(i)<0}):r==="doctor"?a.filter(function(i){return i!==v.ls}):a.filter(function(i){return i!==v.me});
 say("nt",!live?"تو حذف شدی":can?{mafia:"هدف رو انتخاب کن",doctor:"کی رو نجات می‌دی؟",det:"از کی استعلام می‌گیری؟"}[r]:"شب شد");
 say("np",!live?"ساکت تماشا کن.":can?(r==="mafia"?"با هم‌تیمی‌هات آروم صحبت کن.":"بقیه خوابن. تصمیمت رو بگیر."):"چشمات رو ببند. مافیا بیداره.");
 picks("g2",ids,"pl");$("fire").style.display=can?"":"none"}
$("fire").onclick=function(){if(pk<0||S.done)return;var r=S.ro;
 if(r==="mafia"){var e=$("g2").querySelector(".sel i");if(e){var q=e.getBoundingClientRect();burst(q.left+q.width/2,q.top+q.height/2)}buzz([80,60,160]);noise(.4,.6,1800);tone(130,.4,"square",.3,30)}else{buzz(30);tone(500,.1,"sine",.15)}
 sn({t:"act",a:{mafia:"kill",doctor:"save",det:"look"}[r],g:pk})};
$("vb").onclick=function(){if(pk<0||S.done)return;buzz(30);sn({t:"act",a:"vote",g:pk})};
$("nextRole").onclick=function(){sn({t:"ready"})};
$("pass").onclick=function(){sn({t:"pass"})};
function look(d){var f=$("flood"),m=d.m;f.classList.toggle("m",m);say("fw",m?"مافیا":"شهروند");say("fs",S.pl[d.g].n+" · برای بستن لمس کن");f.classList.add("on");buzz(m?[200,80,200]:60);tone(m?80:520,.4,m?"sine":"triangle",.5,m?35:520);if(m)noise(.2,.5,900)}
$("flood").onclick=function(){this.classList.remove("on")};
function dayB(){var v=S,s=v.sp,mine=s===v.me,g=$("gd");say("di",v.pl[s].n[0]);say("dn",v.pl[s].n);say("dl",mine?"نوبت توئه":"نوبت صحبت");say("dt",mine?"حرف بزن. وقتی تموم شد «تمام شد» رو بزن.":"گوش بده و دقت کن.");$("pass").style.display=mine?"":"none";g.innerHTML="";
 v.pl.forEach(function(p,i){var c=el("div","chip"+(i===s?" on":""),p.n);if(!p.a){c.style.opacity=.3;c.style.textDecoration="line-through"}g.appendChild(c)});show("sd");tone(330,.2,"triangle",.12)}
function repB(){var r=S.rep,v=r.k==="v";say("l4",v?"نتیجه رأی‌گیری":"گزارش صبح");say("nm",r.n||"هیچکس");say("h4",r.n?(v?"با رأی شما حذف شد":"دیشب حذف شد"):(v?"رأی‌ها مساوی بود":"شب آرومی بود"));say("p4",r.n?"نقشش: "+RN[r.ro]:"کسی حذف نشد.");show("s4");play4(!!r.n)}
function play4(d){var b=$("bar"),k=$("stk");b.classList.remove("go");k.classList.remove("go");
 setTimeout(function(){b.classList.add("go");noise(.3,.15,2500)},1300);
 if(d)setTimeout(function(){k.classList.add("go");buzz(120);tone(90,.35,"sine",.7,35);noise(.15,.5,900);glitch()},2200)}
function endB(){var e=S.end,g=$("ge");g.innerHTML="";say("ew",e.w==="cit"?"شهروندها بردن":"مافیا برد");S.pl.forEach(function(p,i){g.appendChild(el("div","chip"+(e.ro[i]==="mafia"?" on":""),p.n+" · "+RN[e.ro[i]]))});show("se");glitch();burst(innerWidth/2,innerHeight/3)}
$("again").onclick=function(){location.reload()};

 if(TG&&l)TG.openTelegramLink("https://t.me/share/url?url="+encodeURIComponent(l)+"&text="+encodeURIComponent(t));
 else if(navigator.clipboard){navigator.clipboard.writeText(l||code);say("lm","کپی شد")}};
setInterval(function(){say("tm",S&&S.dl&&S.ph!=="lobby"&&S.ph!=="end"?Math.max(0,Math.ceil((S.dl-Date.now())/1000)):"")},250);

/* entry */
var u=TG&&TG.initDataUnsafe||{};
if(u.user)$("nick").value=u.user.first_name||"";
if(u.start_param)$("code").value=String(u.start_param).toUpperCase();
$("enter").onclick=function(){ac();tone(110,.6,"sine",.3,50);noise(.4,.2,1500);show("sj")};
